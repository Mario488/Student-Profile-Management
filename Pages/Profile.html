<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="../Css/Profile.css">
</head>
<body>
    <div class="navbar">
        <div class="navbarTitle">Student Profile</div>
        <div>
            <a class="home" href="Home.html">Home</a>
            <a class="profile" href="Profile.html">Profile</a>
            <a class="grades" href="Grades.html">Grades</a>
            <a class="eval" href="Evaluation.html">Evaluation</a>
            <a class="enrol" href="Enrolled.html">Enrolled Subjects</a>
            <a id="login" href="Login.html" > Login</a>
            <a id="logout" href="#" style="display: none;">Logout</a>
        </div>
    </div>
    <div class="profileContainer">
        <div class="card">
            <h2>Your Profile</h2>
            <div class="infoContainer">
                <div class="fieldContainer">
                    <span class="fieldLabel">Name</span>
                    <span class="fieldValue" id="studName"></span>
                </div>
                <div class="fieldContainer">
                    <span class="fieldLabel">Student ID</span>
                    <span class="fieldValue" id="studId"></span>
                </div>
                <div class="fieldContainer">
                    <span class="fieldLabel">Program</span>
                    <span class="fieldValue" id="program"></span>
                </div>
                <div class="fieldContainer">
                    <span class="fieldLabel">Year</span>
                    <span class="fieldValue" id="yearLv"></span>
                </div>
                <div class="fieldContainer">
                    <span class="fieldLabel">Status</span>
                    <span class="fieldValue" id="status"></span>
                </div>
                <div class="fieldContainer">
                    <span class="fieldLabel">Address</span>
                    <span class="fieldValue" id="address"></span>
                </div>
                <div class="fieldContainer">
                    <span class="fieldLabel">Gender</span>
                    <span class="fieldValue" id="gender"></span>
                </div>
                <div class="fieldContainer">
                    <span class="fieldLabel">Email</span>
                    <span class="fieldValue" id="email"></span>
                </div>
                <div class="fieldContainer">
                    <span class="fieldLabel">Contact Number</span>
                    <span class="fieldValue" id="contactNum"></span>
                </div>
                <div class="fieldContainer">
                    <span class="fieldLabel">Birthday</span>
                    <span class="fieldValue" id="birthday"></span>
                </div>
            </div>
        </div>
    </div>
    <script src="../Js/Profile.js"></script>
</body>
</html>
