<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Css/SignUp.css">
    <title>Student Profile Management</title>
</head>
<body>
    <div class="container">
        <div id="coverContainer">
            <p id="programName">Student Profile <br> and <br> Management</p>
        </div>
        <div id="signupContainer">
            <form class="signup-form">
                <h2>Signup</h2>

                <div class="form-group">
                    <label for="StudFirstName">First Name</label>
                    <input type="text" id="StudFirstName" required>
                </div>
                <div class="form-group">
                    <label for="StudLastName">Last Name</label>
                    <input type="text" id="StudLastName" required>
                </div>
                <div class="form-group">
                    <label for="StudDateOfBirth">Date of Birth</label>
                    <input type="date" id="StudDateOfBirth" required>
                </div>
                <div class="form-group">
                    <label for="StudGender">Gender</label>
                    <select id="StudGender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="StudContactNumber">Contact Number</label>
                    <input type="text" id="StudContactNumber" minlength="12" maxlength="12" required>
                </div>
                <div class="form-group">
                    <label for="StudAddress">Address</label>
                    <input type="text" id="StudAddress" required>
                </div>
                <div class="form-group">
                    <label for="StudId">Student Id</label>
                    <input type="text" id="StudId" minlength="8" maxlength="8" required>
                </div>
                <div class="form-group">
                    <label for="programId">Program</label>
                    <select id="programId" required>
                        <option value="">Select</option>
                        <option value="1">Bachelor of Science in Computer Science</option>
                        <option value="2">Bachelor of Science in Software Engineering</option>
                        <option value="3">Bachelor of Science in Information Technology</option>
                        <option value="4">Bachelor of Science in Cybersecurity</option>
                        <option value="5">Bachelor of Science in Data Science</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="StudAcademicStatus">Academic Status</label>
                    <select id="StudAcademicStatus" required>
                        <option value="">Select</option>
                        <option value="Regular">Regular</option>
                        <option value="Irregular">Irregular</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="StudAcademicYear">Academic Year</label>
                    <select id="StudAcademicYear" required>
                        <option value="">Select</option>
                        <option value="Freshmen">Freshmen</option>
                        <option value="Sophomore">Sophomore</option>
                        <option value="Junior">Junior</option>
                        <option value="Senior">Senior</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="new-email">Email</label>
                    <input type="email" id="new-email" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Password</label>
                    <input type="password" id="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required>
                </div>

                <button type="submit">Sign up</button>
                <p class="message">Already have an account? <a href="Login.html">Login</a></p>
            </form>
        </div>
    </div>

    <script src="../Js/SignUp.js"></script>
</body>
</html>
